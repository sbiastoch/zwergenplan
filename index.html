<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e8f1ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1620" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Babykurse, Krabbelgruppen und Ausflüge für Kinder unter 3 Jahren in Nürnberg." />
    <title>Zwergenplan</title>
    <!-- Daten parallel zum JS laden statt danach (LCP, Plan 0003 E8). Ersetzt den Preload, den WebKit nicht
         wiederverwendet (Plan 0008, E4). Übernommen von src/data/site.ts (takeEarlyRequest), Pfad wie dort. -->
    <script>
      try {
        window.__zpSite = fetch("/data/site.json");
        // als behandelt markieren: Den Fehler wertet loadSiteData aus, nicht die Konsole
        window.__zpSite.catch(() => {});
      } catch {
        // ohne fetch: loadSiteData lädt selbst
      }
    </script>
    <script>
      // Darstellung vor dem ersten Paint setzen (kein Aufblitzen). Schlüssel wie in src/data/preferences.ts.
      try {
        const choice = localStorage.getItem("zwergenplan.darstellung");
        if (choice === "hell") document.documentElement.dataset.theme = "light";
        if (choice === "dunkel") document.documentElement.dataset.theme = "dark";
      } catch {
        // kein Speicher (privater Modus): automatisch
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
