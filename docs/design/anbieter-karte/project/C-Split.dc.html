<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Karte über der Anbieterliste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;display=swap">
<style>
body{margin:0}
.zp{width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background-color:var(--bg);background-image:radial-gradient(var(--dotc) 1.3px,transparent 1.6px);background-size:18px 18px;color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
.th-light{--bg:#E8F1FF;--dotc:rgba(19,33,46,.13);--surface:#FFFFFF;--rim:#FFFFFF;--ink:#13212E;--muted:#475563;--soft:#EEF3FA;--line:#13212E;--shadow:#13212E;--primary:#13212E;--on-primary:#FFFFFF;--tape:#FFE38A;--tape-stripe:rgba(255,255,255,.5);--on-tape:#13212E;--map:#E1EBF8;--road:#FFFFFF;--park:#D3EBC6;--water:#B3D7F5;--sel:#FFD93B;--on-sel:#13212E}
.zp button{font:inherit;color:inherit;cursor:pointer}
.ic{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:25px;letter-spacing:-.02em}
.logo i{width:28px;height:28px;border-radius:50%;background:#FFD93B;border:2px solid var(--rim);display:grid;place-items:center}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 15px;border-radius:999px;background:var(--surface);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow);font-weight:700;font-size:15px;white-space:nowrap;box-sizing:border-box}
.round{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--line);background:var(--surface);box-shadow:3px 3px 0 var(--shadow);display:grid;place-items:center;box-sizing:border-box}
.chips{display:flex;gap:8px;padding:10px 16px 6px}
.chips .pill{min-height:40px;font-size:14px}
.search{padding:4px 16px 0}
.search input{height:44px;border-radius:14px;border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow);background:var(--surface);padding:0 14px;font:inherit;font-size:15px;color:var(--ink);box-sizing:border-box;width:100%}
.mapf{position:relative;margin:12px 16px 0;border:2.5px solid var(--line);border-radius:22px;overflow:hidden;background:var(--map);box-shadow:4px 4px 0 var(--shadow)}
.mapf svg.bg{position:absolute;inset:0;width:100%;height:100%}
.road{fill:none;stroke:var(--road);stroke-linecap:round}
.lbl{fill:var(--muted);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:12px;font-weight:600}
.pm{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:10px;background:var(--surface);border:2px solid var(--line);box-shadow:2px 2px 0 var(--shadow);display:grid;place-items:center;color:var(--ink);box-sizing:border-box}
.pm b{position:absolute;top:-10px;right:-10px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:var(--primary);color:var(--on-primary);font-size:11px;line-height:16px;text-align:center;border:2px solid var(--surface)}
.pm.idle{opacity:.55;border-style:dashed;box-shadow:none}
.cl{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:var(--primary);color:var(--on-primary);border:2px solid var(--surface);box-shadow:2px 2px 0 var(--shadow);display:grid;place-items:center;font-weight:800;font-size:14px;box-sizing:border-box}
.origin{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#2F7BF6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,123,246,.25)}
.expand{position:absolute;right:8px;bottom:8px;width:40px;height:40px}
.attr{position:absolute;left:8px;bottom:6px;font-size:9px;color:var(--muted)}
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 8px;font-size:14px;color:var(--muted)}
.status b{color:var(--ink)}
.link{font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;min-height:44px}
.rows{list-style:none;margin:0;padding:0 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border:2px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:3px 3px 0 var(--shadow)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left;border:0;background:transparent;padding:0}
.row .t b{font-size:16px;font-weight:800;line-height:1.25}
.row .t span{font-size:13px;color:var(--muted)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:78px;display:flex;align-items:stretch;padding:8px 10px 10px;box-sizing:border-box;background-color:var(--tape);background-image:repeating-linear-gradient(-45deg,var(--tape-stripe) 0 9px,transparent 9px 20px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:var(--on-tape);border:2px solid transparent;border-radius:16px;background:transparent}
.tab.on{background:var(--surface);border-color:var(--line);box-shadow:3px 3px 0 var(--shadow);color:var(--ink)}
</style>
</helmet>
<div class="zp th-light">
  <div class="hdr">
    <div class="logo"><i><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 14 13H2Z" fill="#FF6B6B"></path></svg></i>Zwergenplan</div>

      <path class="road" stroke-width="9" d="M180 70 Q236 72 244 120 Q246 172 185 178 Q124 176 122 122 Q126 72 180 70Z"></path>
      <path class="road" stroke-width="6" d="M0 70 L122 115 M244 120 L354 105 M185 178 L200 250 M180 70 L170 0 M122 122 L20 250 M244 135 L354 240"></path>

      <text class="lbl" x="18" y="104">Fürth</text>

      <text class="lbl" x="54" y="166">Gostenhof</text>
      <text class="lbl" x="204" y="214">Südstadt</text>
    </svg>
    <span class="cl" style="left:180px;top:124px">9</span>
    <span class="cl" style="left:46px;top:118px">6</span>
    <span class="pm" style="left:96px;top:160px"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16M5 10l1.5-5h11l1.5 5M6 10v9h12v-9M10 19v-5h4v5"></path></svg><b>3</b></span>
    <span class="pm" style="left:270px;top:64px"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16M5 10l1.5-5h11l1.5 5M6 10v9h12v-9M10 19v-5h4v5"></path></svg></span>
    <span class="pm" style="left:232px;top:200px"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16M5 10l1.5-5h11l1.5 5M6 10v9h12v-9M10 19v-5h4v5"></path></svg></span>
    <span class="pm idle" style="left:300px;top:160px"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16M5 10l1.5-5h11l1.5 5M6 10v9h12v-9M10 19v-5h4v5"></path></svg></span>
    <span class="origin" style="left:150px;top:196px"></span>
    <button type="button" class="round expand" aria-label="Karte groß"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
    <div class="attr">OpenFreeMap © OpenMapTiles · OpenStreetMap</div>
  </div>
  <div class="status">
    <span><b>12</b> Anbieter im Kartenausschnitt</span>

  </div>
  <ul class="rows">

      <button type="button" class="round" aria-label="Anbieter merken"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"></path></svg></button>

      <button type="button" class="round" aria-label="Anbieter merken"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"></path></svg></button>

  <nav class="tabs" aria-label="Bereiche">
    <button type="button" class="tab"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5Z"></path></svg>Angebote</button>
    <button type="button" class="tab on" aria-current="page"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16M5 10l1.5-5h11l1.5 5M6 10v9h12v-9M10 19v-5h4v5"></path></svg>Anbieter</button>
    <button type="button" class="tab"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"></path></svg>Merkliste</button>

</div>
