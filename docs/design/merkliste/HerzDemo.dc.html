<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Demo: Herz tippen und halten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;display=swap">
<style>
body{margin:0}
.zp{width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background-color:#E8F1FF;background-image:radial-gradient(rgba(19,33,46,.13) 1.3px,transparent 1.6px);background-size:18px 18px;color:#13212E;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
.zp button{font:inherit;color:inherit;cursor:pointer}
.ic{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:23px;letter-spacing:-.02em}
.logo i{width:28px;height:28px;border-radius:50%;background:#FFD93B;border:2px solid #fff;display:grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px 0 6px;border-radius:999px;background:#fff;border:2px solid #13212E;box-shadow:3px 3px 0 #13212E;font-weight:800;font-size:15px}
.face{width:28px;height:28px;border-radius:50%;background:#FFB13B;display:grid;place-items:center}
.agday{display:flex;align-items:baseline;gap:8px;padding:16px 16px 8px}
.agday b{font-size:22px;font-weight:800;letter-spacing:-.03em}
.agday span{font-size:14px;color:#475563;font-weight:600}
.card{position:relative;margin:0 16px 14px;background:#fff;border:2px solid #13212E;border-radius:22px;box-shadow:5px 5px 0 #13212E;padding:12px 70px 14px 16px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cat{display:inline-flex;align-items:center;gap:6px;border:2px solid #13212E;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700}
.sh{width:9px;height:9px;background:#13212E;border-radius:50%}
.when{font-size:14px;font-weight:800}
.ttl{margin:4px 0 0;font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.meta{font-size:14px;color:#475563;margin-top:2px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.f{background:#EEF3FA;border-radius:8px;padding:3px 8px;font-size:13px;font-weight:600}
.f.out{background:#fff;border:1.5px solid #13212E}

.heart{--hold:550ms;position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;border:2px solid #13212E;background:#fff;box-shadow:2px 2px 0 #13212E;display:grid;place-items:center;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:background-color .2s ease}
.heart:focus-visible{outline:3px solid #2F7BF6;outline-offset:3px}
.heart.s1{background:#FFD6D6}
.heart.s2{background:#FF6B6B}
.hw{display:grid;place-items:center;transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.hs{position:relative;width:24px;height:24px}
.fillbox{position:absolute;inset:0;clip-path:path('M12 20.6C12 20.6 4.6 16 4.6 10.1A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.4 10.1C19.4 16 12 20.6 12 20.6Z')}
.lvl{position:absolute;left:0;right:0;bottom:0;height:0;background:#13212E;transition:height .25s ease}
.half.s1 .lvl{height:52%}
.s2 .lvl{height:100%}
.hs svg{position:absolute;inset:0}
.outline{fill:none;stroke:#13212E;stroke-width:2.2;stroke-linejoin:round}
.ring{position:absolute;left:-10px;top:-10px;width:64px;height:64px;pointer-events:none;opacity:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:#13212E;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:176;stroke-dashoffset:176}
.holding .ring{opacity:1}
.holding .ring circle{stroke-dashoffset:0;transition:stroke-dashoffset var(--hold) linear}
.holding .hw{transform:scale(1.6);transition:transform var(--hold) cubic-bezier(.3,0,.5,1)}
.holding.fuellen .hw{transform:scale(1.3)}
.holding.fuellen .lvl{height:100%;transition:height var(--hold) linear}
.holding{background:#FFD6D6}

.a-small .hw{animation:popSmall .45s cubic-bezier(.2,1.2,.4,1)}
.a-big .hw{animation:popBig .6s cubic-bezier(.2,1.2,.4,1)}
.a-big{animation:btnPop .5s cubic-bezier(.2,1.2,.4,1)}
.a-out .hw{animation:deflate .35s ease}
@keyframes popSmall{0%{transform:scale(1)}40%{transform:scale(1.35)}70%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes popBig{0%{transform:scale(1.3)}30%{transform:scale(1.95)}60%{transform:scale(.85)}100%{transform:scale(1)}}
@keyframes btnPop{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes deflate{0%{transform:scale(1)}45%{transform:scale(.55)}100%{transform:scale(1)}}

.sparks{position:absolute;inset:0;pointer-events:none}
.sparks i{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#FF6B6B;border:1.5px solid #13212E;opacity:0;box-sizing:border-box}
.sparks i:nth-child(2n){background:#FFD93B}
.sparks i:nth-child(1){--r:0deg}.sparks i:nth-child(2){--r:45deg}.sparks i:nth-child(3){--r:90deg}.sparks i:nth-child(4){--r:135deg}.sparks i:nth-child(5){--r:180deg}.sparks i:nth-child(6){--r:225deg}.sparks i:nth-child(7){--r:270deg}.sparks i:nth-child(8){--r:315deg}
.funken.a-big .sparks i{animation:spark .65s cubic-bezier(.1,.8,.3,1)}
@keyframes spark{0%{opacity:1;transform:rotate(var(--r)) translateY(-10px) scale(.5)}100%{opacity:0;transform:rotate(var(--r)) translateY(-42px) scale(1)}}

.toast{position:absolute;left:16px;right:16px;bottom:92px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 16px;min-height:56px;box-sizing:border-box;border-radius:18px;background:#13212E;color:#fff;box-shadow:4px 4px 0 rgba(19,33,46,.35);font-size:15px;animation:toastIn .25s ease}
@keyframes toastIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.undo{border:0;background:none;color:#FFD93B !important;font-weight:800 !important;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 8px;white-space:nowrap}
.tabs{position:absolute;left:0;right:0;bottom:0;height:78px;display:flex;padding:8px 10px 10px;box-sizing:border-box;background-color:#FFE38A;background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.5) 0 9px,transparent 9px 20px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;border:2px solid transparent;border-radius:16px;background:transparent;position:relative}
.tab.on{background:#fff;border-color:#13212E;box-shadow:3px 3px 0 #13212E}
.badge{position:absolute;top:2px;left:58%;min-width:20px;height:20px;border-radius:999px;background:#FF6B6B;color:#13212E;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-sizing:border-box}
@media (prefers-reduced-motion: reduce){
  .hw,.heart,.lvl,.ring circle,.toast{transition:none !important;animation:none !important}
  .holding .hw{transform:none}
  .sparks{display:none}
}
</style>
</helmet>
<div class="zp">
  <div class="hdr">
    <div class="logo"><i><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 14 13H2Z" fill="#FF6B6B"></path></svg></i>Zwergenplan</div>
    <button type="button" class="pill"><span class="face"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 14.5a4 4 0 0 0 7 0M9 10h.01M15 10h.01"></path></svg></span>4 Mon.</button>
  </div>
  <div class="agday"><b>Diese Woche</b><span>5.–11. Oktober</span></div>
  <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
    <article class="card">
      <div class="top"><span class="cat" style="background:{{c.color}}"><span class="sh"></span>{{c.cat}}</span><span class="when">{{c.when}}</span></div>
      <h3 class="ttl">{{c.title}}</h3>
      <div class="meta">{{c.place}}</div>
      <div class="facts"><span class="f">{{c.fact}}</span><span class="f out">{{c.reg}}</span></div>
      <button type="button" class="heart {{c.cls}}" style="--hold: {{holdMs}}" aria-label="{{c.label}}" onPointerDown="{{c.down}}" onPointerUp="{{c.up}}" onPointerLeave="{{c.cancel}}" onPointerCancel="{{c.cancel}}" onClick="{{c.click}}" onContextMenu="{{noMenu}}">
        <svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28"></circle></svg>
        <span class="hw">
          <span class="hs">
            <span class="fillbox"><span class="lvl"></span></span>
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path class="outline" d="M12 20.6C12 20.6 4.6 16 4.6 10.1A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.4 10.1C19.4 16 12 20.6 12 20.6Z"></path></svg>
          </span>
        </span>
        <span class="sparks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </button>
    </article>
  </sc-for>
  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ true }}">
    <div class="toast" role="status"><span>{{toast}}</span><sc-if value="{{hasUndo}}" hint-placeholder-val="{{ false }}"><button type="button" class="undo" onClick="{{undo}}">Rückgängig</button></sc-if></div>
  </sc-if>
  <nav class="tabs" aria-label="Hauptnavigation">
    <button type="button" class="tab on" aria-current="page"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5Z"></path></svg>Angebote</button>
    <button type="button" class="tab"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10 5.5 4h13L20 10M4 10h16v10H4ZM9 20v-5h6v5"></path></svg>Anbieter</button>
    <button type="button" class="tab"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"></path></svg>Merkliste<sc-if value="{{hasCount}}" hint-placeholder-val="{{ true }}"><span class="badge">{{count}}</span></sc-if></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stil":{"editor":"enum","options":["Aufblasen","Funken","Füllen"],"default":"Funken"},"haltezeit":{"editor":"range","min":300,"max":1000,"step":50,"unit":"ms","default":550},"vorgemerkt":{"editor":"enum","options":["Hell","Halb voll"],"default":"Halb voll"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      stages: { a: 0, b: 1, c: 2 },
      anim: {},
      holding: null,
      toast: 'Tippen: vormerken · Halten: fest einplanen',
      undo: null,
    };
    this.timer = null;
    this.toastTimer = null;
    this.animTimers = {};
    this.downId = null;
    this.held = false;
  }

  componentWillUnmount() {
    clearTimeout(this.timer);
    clearTimeout(this.toastTimer);
    Object.values(this.animTimers).forEach((t) => clearTimeout(t));
  }

  holdMs() {
    return this.props.haltezeit ?? 550;
  }

  buzz(ms) {
    try {
      if (navigator.vibrate) navigator.vibrate(ms);
    } catch (e) {}
  }

  setStage(id, stage, anim) {
    this.setState((s) => ({ stages: { ...s.stages, [id]: stage }, anim: { ...s.anim, [id]: anim } }));
    clearTimeout(this.animTimers[id]);
    this.animTimers[id] = setTimeout(() => {
      this.setState((s) => ({ anim: { ...s.anim, [id]: '' } }));
    }, 700);
  }

  say(text, undo) {
    this.setState({ toast: text, undo: undo });
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => this.setState({ toast: null, undo: null }), 4000);
  }

  down(id, e) {
    if (e && e.button > 0) return;
    this.downId = id;
    this.held = false;
    clearTimeout(this.timer);
    if (this.state.stages[id] === 2) return;
    this.setState({ holding: id });
    this.timer = setTimeout(() => {
      const prev = this.state.stages[id];
      this.held = true;
      this.setState({ holding: null });
      this.setStage(id, 2, 'a-big');
      this.buzz(25);
      this.say('Fest eingeplant', { id: id, prev: prev });
    }, this.holdMs());
  }

  up(id) {
    if (this.downId !== id) return;
    clearTimeout(this.timer);
    this.downId = null;
    this.setState({ holding: null });
    if (this.held) {
      this.held = false;
      return;
    }
    this.tap(id);
  }

  cancel() {
    clearTimeout(this.timer);
    this.downId = null;
    if (this.state.holding) this.setState({ holding: null });
  }

  click(id, e) {
    // nur Tastatur (Enter/Leertaste): Zeiger laufen über down/up
    if (e && e.detail === 0) this.tap(id);
  }

  tap(id) {
    const prev = this.state.stages[id];
    if (prev === 0) {
      this.setStage(id, 1, 'a-small');
      this.buzz(8);
      this.say('Vorgemerkt. Nochmal tippen oder halten: fest einplanen', { id: id, prev: prev });
    } else if (prev === 1) {
      this.setStage(id, 2, 'a-big');
      this.buzz(25);
      this.say('Fest eingeplant', { id: id, prev: prev });
    } else {
      this.setStage(id, 0, 'a-out');
      this.say('Von der Merkliste entfernt', { id: id, prev: prev });
    }
  }

  undoIt() {
    const u = this.state.undo;
    if (!u) return;
    this.setStage(u.id, u.prev, '');
    this.setState({ toast: null, undo: null });
  }

  renderVals() {
    const stil = this.props.stil ?? 'Funken';
    const sty = stil === 'Füllen' ? 'fuellen' : stil === 'Funken' ? 'funken' : 'blasen';
    const half = (this.props.vorgemerkt ?? 'Halb voll') === 'Halb voll' ? 'half' : '';
    const labels = [
      'Merken',
      'Vorgemerkt. Nochmal tippen oder halten: fest einplanen',
      'Fest eingeplant. Tippen entfernt es von der Merkliste',
    ];
    const offers = [
      { id: 'a', cat: 'Bücher & Vorlesen', color: '#7FD18B', when: 'Fr 9.10. · 10:30 Uhr', title: 'Krabbelreime & Fingerspiele', place: 'Bibliothek Beispiel (fiktiv) · Altstadt', fact: 'Freitags', reg: 'Ohne Anmeldung' },
      { id: 'b', cat: 'Musik & Singen', color: '#FF7070', when: 'ab Do 5.11. · 16:00 Uhr', title: 'Babymusik (6–12 Monate)', place: 'Musikschule Beispiel (fiktiv) · Südstadt', fact: 'Kurs · 10 Termine', reg: 'Anmeldung nötig' },
      { id: 'c', cat: 'Babykurse', color: '#FF8CC0', when: 'ab Di 12.1. · 9:30 Uhr', title: 'PEKiP-Gruppe Winter', place: 'Familientreff Beispielhof (fiktiv) · Altstadt', fact: 'Kurs · 8 Termine', reg: 'Anmeldung nötig' },
    ];
    const cards = offers.map((o) => {
      const s = this.state.stages[o.id];
      const a = this.state.anim[o.id] || '';
      const h = this.state.holding === o.id ? 'holding' : '';
      return {
        ...o,
        cls: ['s' + s, sty, half, a, h].filter(Boolean).join(' '),
        label: labels[s],
        down: (e) => this.down(o.id, e),
        up: () => this.up(o.id),
        cancel: () => this.cancel(),
        click: (e) => this.click(o.id, e),
      };
    });
    const count = Object.values(this.state.stages).filter((s) => s > 0).length;
    return {
      cards: cards,
      holdMs: this.holdMs() + 'ms',
      count: count,
      hasCount: count > 0,
      toast: this.state.toast,
      hasToast: !!this.state.toast,
      hasUndo: !!this.state.undo,
      undo: () => this.undoIt(),
      noMenu: (e) => e.preventDefault(),
    };
  }
}
</script>
</body>
</html>
