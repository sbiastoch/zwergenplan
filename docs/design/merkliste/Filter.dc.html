<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Merkliste: Filter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;display=swap">
<style>
body{margin:0}
.zp{width:390px;position:relative;overflow:hidden;box-sizing:border-box;background:#5E6873;color:#13212E;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
.zp button{font:inherit;color:inherit;cursor:pointer}
.ic{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.behind{height:86px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#E8F1FF;font-weight:800;font-size:23px;opacity:.6}
.sheet{position:absolute;left:0;right:0;top:86px;bottom:0;border-radius:28px 28px 0 0;background-color:#E8F1FF;background-image:radial-gradient(rgba(19,33,46,.13) 1.3px,transparent 1.6px);background-size:18px 18px;padding:10px 16px 110px;box-sizing:border-box}
.grip{width:44px;height:5px;border-radius:3px;background:#7A8794;margin:0 auto 10px}
.st{margin:0 0 4px;font-size:30px;font-weight:800;letter-spacing:-.04em}
.lab{margin:20px 0 8px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#475563}
.hint{margin:6px 0 0;font-size:13px;color:#475563}
.wrap{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:#fff;border:2px solid #13212E;box-shadow:3px 3px 0 #13212E;font-weight:700;font-size:15px;white-space:nowrap;box-sizing:border-box}
.chip.on{background:#FFD93B}
.sh{width:10px;height:10px;border-radius:50%}
.dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.dates label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:#475563}
.dates input{height:44px;border-radius:14px;border:2px solid #13212E;background:#fff;padding:0 12px;font:inherit;font-size:15px;color:#13212E;box-sizing:border-box}
.foot{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:#fff;border-top:2px solid #13212E;box-sizing:border-box}
.reset{background:none;border:0;font-weight:800;font-size:16px;text-decoration:underline wavy;text-underline-offset:5px;min-height:44px;padding:0 4px}
.show{flex:1;max-width:236px;min-height:52px;border-radius:999px;border:0;background:#13212E;color:#fff !important;font-weight:800 !important;font-size:16px}
</style>
</helmet>
<div class="zp" style="height:1500px">
  <div class="behind" aria-hidden="true"><span>Zwergenplan</span><span>4 Mon.</span></div>
  <div class="sheet" role="dialog" aria-label="Merkliste filtern">
    <div class="grip"></div>
    <h2 class="st">Merkliste filtern</h2>

    <p class="lab">Merkliste</p>
    <div class="wrap">
      <button type="button" class="chip on" aria-pressed="true"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Alle gemerkten</button>
      <button type="button" class="chip" aria-pressed="false">Nur fest eingeplant</button>
    </div>

    <p class="lab">Tageszeit</p>
    <div class="wrap">
      <button type="button" class="chip" aria-pressed="false">Vormittags</button>
      <button type="button" class="chip" aria-pressed="false">Mittags</button>
      <button type="button" class="chip" aria-pressed="false">Nachmittags</button>
    </div>
    <p class="hint">Beginn vor 12 Uhr, 12–15 Uhr, ab 15 Uhr</p>

    <p class="lab">Art</p>
    <div class="wrap">
      <button type="button" class="chip"><span class="sh" style="background:#FF8CC0"></span>Babykurse</button>
      <button type="button" class="chip"><span class="sh" style="background:#FFB13B;border-radius:2px"></span>Krabbel- &amp; Spielgruppen</button>
      <button type="button" class="chip"><span class="sh" style="background:#B99CFF"></span>Treffs &amp; Cafés</button>
      <button type="button" class="chip"><span class="sh" style="background:#2EC4B6"></span>Bewegung &amp; Turnen</button>
      <button type="button" class="chip"><span class="sh" style="background:#5CB8FF"></span>Wasser</button>
      <button type="button" class="chip"><span class="sh" style="background:#FF7070"></span>Musik &amp; Singen</button>
      <button type="button" class="chip"><span class="sh" style="background:#FFD23B"></span>Kreativ &amp; Basteln</button>
      <button type="button" class="chip"><span class="sh" style="background:#7FD18B"></span>Bücher &amp; Vorlesen</button>
    </div>

    <p class="lab">Format</p>
    <div class="wrap">
      <button type="button" class="chip">Kurs</button>
      <button type="button" class="chip">Regelmäßig</button>
      <button type="button" class="chip">Einmalig</button>
    </div>

    <p class="lab">Anmeldung</p>
    <div class="wrap">
      <button type="button" class="chip on"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Egal</button>
      <button type="button" class="chip">Ohne Anmeldung</button>
      <button type="button" class="chip">Mit Anmeldung</button>
    </div>

    <p class="lab">Kosten</p>
    <div class="wrap">
      <button type="button" class="chip on"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Egal</button>
      <button type="button" class="chip">Kostenlos</button>
      <button type="button" class="chip">Kostenpflichtig</button>
    </div>

    <p class="lab">Zeitraum</p>
    <div class="wrap">
      <button type="button" class="chip">ab Nov.</button>
      <button type="button" class="chip">ab Dez.</button>
      <button type="button" class="chip">ab Jan.</button>
    </div>
    <div class="dates">
      <label>von<input type="text" value="" placeholder="TT.MM.JJJJ"></label>
      <label>bis<input type="text" value="" placeholder="TT.MM.JJJJ"></label>
    </div>
    <p class="hint">Im Kalender gilt stattdessen die gewählte Woche bzw. der Monat.</p>

    <p class="lab">Wegzeit</p>
    <div class="wrap">
      <button type="button" class="chip on"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Egal</button>
      <button type="button" class="chip">bis 20 Min.</button>
      <button type="button" class="chip">bis 30 Min.</button>
      <button type="button" class="chip">bis 45 Min.</button>
    </div>
    <p class="hint">mit Bus &amp; Bahn ab Gostenhof</p>

    <div class="foot">
      <button type="button" class="reset">Zurücksetzen</button>
      <button type="button" class="show">8 Angebote zeigen</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
