name: CI & Deploy

on:
  push:
    branches: ["**"] # jeder Branch wird geprüft, deployt wird nur main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Doku-Pfad (Plan 0027, E10; ADR 0021, Teil B): full=false nur, wenn seit einem voll grün geprüften Stand nur Dateien
  # der Doku-Positivliste dazukamen (scripts/lib/change-class.ts). Auf main ist das der live ausgelieferte Commit
  # (Deployments-API), auf anderen Branches der Vorgänger mit grünem Push-Lauf derselben Ref. Dann laufen nur check
  # und gates, ohne E2E, Smoke und Deploy. Im Zweifel und bei jedem Fehler full=true, nie Rot.
  # E2E nach Diff (Plan 0029, B5; ADR 0023): Bei einem Push auf einen Branch außer main wählt scope die Specs, die der
  # Diff seit merge-base origin/main erreicht (e2e=select mit specs, devices, smoke; oder e2e=none). Auf main, bei
  # Pull Requests und workflow_dispatch e2e=full. Die Garantie hängt an drei Stellen unabhängig von scope: SPECS ist
  # auf main leer, gates verlangt auf main e2e=full (scripts/lib/ci-gates.ts), deploy ebenfalls.
  scope:
    name: Umfang (Doku-Pfad)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      # Fehlt die Ausgabe (Skript abgestürzt), gilt full=true und die volle Suite (Review B2).
      full: ${{ steps.scope.outputs.full || 'true' }}
      e2e: ${{ steps.scope.outputs.e2e || 'full' }}
      specs: ${{ steps.scope.outputs.specs || '' }}
      devices: ${{ steps.scope.outputs.devices || 'true' }}
      smoke: ${{ steps.scope.outputs.smoke || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Vorfahre und Diff bis zum live ausgelieferten Commit bzw. bis merge-base origin/main
          persist-credentials: false
      # Ohne pnpm install: ci-scope.ts braucht nur Node-Builtins und reine Module aus scripts/lib.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: scope
        name: full bestimmen
        # Ein Absturz macht den Lauf nicht rot; ohne Ausgabe greift oben full=true (Review 2, Minor 2).
        continue-on-error: true
        run: node scripts/ci-scope.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_BEFORE: ${{ github.event.before }}

  check:
    name: Statische Gates & Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Enthält seit Plan 0027 (E2) auch knip und die Schema-Drift. Sie laufen in der CI NUR über check:fast,
      # deshalb nicht aus check-fast.ts entfernen, ohne hier wieder eigene Schritte anzulegen.
      - name: check:fast (Typen, Lint, Architektur, Daten, Unit, tote Pfade, Schema-Drift)
        run: pnpm check:fast
      - name: Coverage (src/domain)
        run: pnpm test:coverage
      - name: Plausibilität gegen deployten Stand
        if: github.ref == 'refs/heads/main'
        run: pnpm data:validate --against-deployed

  # E2E je Engine und Shard, parallel zu check (Plan 0013). Welche Projekte eine Suite hat, legt PW_SUITE in
  # playwright.config.ts fest; ein Gerät mit neuer Engine wirft dort beim Laden, bis es hier eine Zeile bekommt.
  # Playwright shardet nach Testzahl, nicht nach Dauer: deshalb Chromium und WebKit (≈ 2,5× teurer) getrennt.
  # Gemessen (Plan 0013, Ergebnis): 4 + 2 Shards mit je 2 Workern 6,2–6,4 Min. vom ersten Start bis gates,
  # langsamster Job webkit 2/2 mit 6,1–6,2 Min. 2 + 1 Shards mit je 4 Workern waren bis zu 29 % langsamer
  # und drückten den LCP von pixel-7 auf 2044 ms (sonst ≈ 1430 ms, Budget 2500 ms).
  # Stand 2026-10-08 (Plan 0027, Ausgangslage): 2 422 statt 1 911 Tests, 9–10,6 Min. vom Push bis zum Deploy,
  # langsamster Job chromium 2/4 (pixel-7) mit 8,8 Min. – immer noch unter dem Timeout von 15 Min.
  # Auswahl (Plan 0029, B5): Die Matrix bleibt statisch, Playwright shardet nach dem Spec-Filter, ein leerer Shard
  # endet dank --pass-with-no-tests grün. Auf main läuft der Job immer, auf Branches nur mit Geräte-Specs.
  e2e:
    name: E2E ${{ matrix.engine }} ${{ matrix.shard }}/${{ matrix.total }}
    needs: scope
    if: needs.scope.outputs.full == 'true' && (github.ref == 'refs/heads/main' || needs.scope.outputs.e2e == 'full' || needs.scope.outputs.devices == 'true')
    runs-on: ubuntu-latest
    # Schutz gegen Hänger, kein Qualitäts-Gate: doppelter längster Job (6,2 Min.), aufgerundet (Plan 0013, E5),
    # plus Puffer für Wiederholungen der Browser-Installation (.github/install-browsers.sh).
    timeout-minutes: 20
    strategy:
      fail-fast: false # alle Fehler eines Laufs auf einmal sehen; gates sperrt den Deploy trotzdem
      matrix:
        include:
          - { engine: chromium, shard: 1, total: 4 }
          - { engine: chromium, shard: 2, total: 4 }
          - { engine: chromium, shard: 3, total: 4 }
          - { engine: chromium, shard: 4, total: 4 }
          - { engine: webkit, shard: 1, total: 2 }
          - { engine: webkit, shard: 2, total: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Zeitlimits und Wiederholung gegen hängendes apt (2026-10-08), siehe Skript.
      - name: Playwright-Browser
        timeout-minutes: 9
        run: .github/install-browsers.sh ${{ matrix.engine }}
      - name: Fixture-Build
        run: pnpm build:e2e
      # SPECS kommt über env, nie direkt in run (Review m3); ci-scope.ts prüft jeden Namen gegen
      # ^e2e/[a-z0-9.-]+\.spec\.ts$. $SPECS steht absichtlich ohne Anführungszeichen, damit es in Wörter zerfällt.
      # Auf main ist SPECS immer leer, auch wenn scope sich irrt: volle Suite.
      - name: E2E
        run: pnpm exec playwright test $SPECS --shard=${{ matrix.shard }}/${{ matrix.total }} --workers=2 --pass-with-no-tests
        env:
          CI: "true"
          PW_SUITE: ${{ matrix.engine }}
          SPECS: ${{ needs.scope.outputs.e2e == 'select' && github.ref != 'refs/heads/main' && needs.scope.outputs.specs || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.engine }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Smoke mit echten Daten gegen genau den Build, der deployt wird, allein auf seinem Runner (Plan 0003 E8, Plan 0013).
  # Der Job läuft bei full immer (Deploy-Build, Budgets, Pages-Artefakt), der Smoke-Schritt auf Branches nur, wenn die
  # Auswahl Smoke-Specs nennt (Plan 0029, B5).
  smoke:
    name: Smoke (Deploy-Build) & Budgets
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    # Schutz gegen Hänger, kein Qualitäts-Gate: doppelter längster Job (2,6 Min.), aufgerundet (Plan 0013, E5),
    # plus Puffer für Wiederholungen der Browser-Installation (.github/install-browsers.sh).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright-Browser
        timeout-minutes: 9
        run: .github/install-browsers.sh chromium
      - name: Deploy-Build
        run: pnpm build
      - name: Smoke mit echten Daten
        if: github.ref == 'refs/heads/main' || needs.scope.outputs.e2e == 'full' || needs.scope.outputs.smoke == 'true'
        run: pnpm exec playwright test
        env:
          CI: "true"
          PW_SUITE: smoke
      # always(): Die Werte zählen gerade dann, wenn der Smoke rot ist (Review 2, m1)
      - name: Schrift-Swap je Fallback (Plan 0007, B6)
        if: always() && (github.ref == 'refs/heads/main' || needs.scope.outputs.e2e == 'full' || needs.scope.outputs.smoke == 'true')
        run: cat test-results/font-swap-werte.txt || echo "keine Swap-Werte"
      - name: Bundle-Budgets
        run: pnpm size
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7
      - name: Pages-Artefakt
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Der eine Knoten für „alles grün“, auch auf Branches. Läuft auch, wenn ein Prüf-Job rot oder übersprungen ist
  # (Doku-Pfad, keine Geräte-Specs), und prüft die Ergebnisse selbst. Die Regeln stehen rein in
  # scripts/lib/ci-gates.ts mit Tabellentest (Plan 0029, B5): scope und check immer success; Doku-Pfad ohne E2E und
  # Smoke; auf main e2e=full und E2E und Smoke success; auf Branches E2E übersprungen nur ohne Geräte-Specs.
  gates:
    name: Alle Gates grün
    needs: [scope, check, e2e, smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Ohne pnpm install: ci-gates.ts braucht nur Node-Builtins (ci-scope-builtins-only).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Ergebnisse prüfen
        run: node scripts/ci-gates.ts
        env:
          REF: ${{ github.ref }}
          FULL: ${{ needs.scope.outputs.full }}
          E2E_MODE: ${{ needs.scope.outputs.e2e }}
          DEVICES: ${{ needs.scope.outputs.devices }}
          SMOKE_MODE: ${{ needs.scope.outputs.smoke }}
          R_SCOPE: ${{ needs.scope.result }}
          R_CHECK: ${{ needs.check.result }}
          R_E2E: ${{ needs.e2e.result }}
          R_SMOKE: ${{ needs.smoke.result }}

  deploy:
    name: Deploy (GitHub Pages)
    needs: [gates, scope]
    # Doku-Pfad deployt nicht: Live bleibt der zuletzt voll geprüfte Stand (Plan 0027, E10). Ausgeliefert wird nur
    # nach der vollen Suite (e2e=full), zusätzlich zu gates (Plan 0029, B5; ADR 0023, Nr. 7).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.scope.outputs.full == 'true' && needs.scope.outputs.e2e == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
