name: CI & Deploy

on:
  push:
    branches: ["**"] # jeder Branch wird geprüft, deployt wird nur main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Statische Gates & Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Enthält seit Plan 0027 (E2) auch knip und die Schema-Drift. Sie laufen in der CI NUR über check:fast,
      # deshalb nicht aus check-fast.ts entfernen, ohne hier wieder eigene Schritte anzulegen.
      - name: check:fast (Typen, Lint, Architektur, Daten, Unit, tote Pfade, Schema-Drift)
        run: pnpm check:fast
      - name: Coverage (src/domain)
        run: pnpm test:coverage
      - name: Plausibilität gegen deployten Stand
        if: github.ref == 'refs/heads/main'
        run: pnpm data:validate --against-deployed

  # E2E je Engine und Shard, parallel zu check (Plan 0013). Welche Projekte eine Suite hat, legt PW_SUITE in
  # playwright.config.ts fest; ein Gerät mit neuer Engine wirft dort beim Laden, bis es hier eine Zeile bekommt.
  # Playwright shardet nach Testzahl, nicht nach Dauer: deshalb Chromium und WebKit (≈ 2,5× teurer) getrennt.
  # Gemessen (Plan 0013, Ergebnis): 4 + 2 Shards mit je 2 Workern 6,2–6,4 Min. vom ersten Start bis gates,
  # langsamster Job webkit 2/2 mit 6,1–6,2 Min. 2 + 1 Shards mit je 4 Workern waren bis zu 29 % langsamer
  # und drückten den LCP von pixel-7 auf 2044 ms (sonst ≈ 1430 ms, Budget 2500 ms).
  # Stand 2026-10-08 (Plan 0027, Ausgangslage): 2 422 statt 1 911 Tests, 9–10,6 Min. vom Push bis zum Deploy,
  # langsamster Job chromium 2/4 (pixel-7) mit 8,8 Min. – immer noch unter dem Timeout von 15 Min.
  e2e:
    name: E2E ${{ matrix.engine }} ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-latest
    # Schutz gegen Hänger, kein Qualitäts-Gate: doppelter längster Job (6,2 Min.), aufgerundet (Plan 0013, E5).
    timeout-minutes: 15
    strategy:
      fail-fast: false # alle Fehler eines Laufs auf einmal sehen; gates sperrt den Deploy trotzdem
      matrix:
        include:
          - { engine: chromium, shard: 1, total: 4 }
          - { engine: chromium, shard: 2, total: 4 }
          - { engine: chromium, shard: 3, total: 4 }
          - { engine: chromium, shard: 4, total: 4 }
          - { engine: webkit, shard: 1, total: 2 }
          - { engine: webkit, shard: 2, total: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Der Download hing am 2026-10-08 zweimal 15 min (Job-Timeout). Gemessen dauert er 22–37 s. Jeder Versuch hat
      # 300 s (apt lädt vom Mirror teils langsam), es gibt bis zu drei, der Schritt ist auf 15 min begrenzt (Plan 0027).
      - name: Playwright-Browser
        timeout-minutes: 15
        run: |
          # Ein abgebrochener Versuch kann ein apt-get mit dpkg-Lock hinterlassen: Der nächste wartet darauf.
          echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          for i in 1 2 3; do
            timeout 300 pnpm exec playwright install --with-deps ${{ matrix.engine }} && exit 0
            echo "::warning::Browser-Installation Versuch $i hing oder schlug fehl, neuer Versuch"
          done
          exit 1
      - name: Fixture-Build
        run: pnpm build:e2e
      - name: E2E
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ matrix.total }} --workers=2
        env:
          CI: "true"
          PW_SUITE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.engine }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Smoke mit echten Daten gegen genau den Build, der deployt wird, allein auf seinem Runner (Plan 0003 E8, Plan 0013).
  smoke:
    name: Smoke (Deploy-Build) & Budgets
    runs-on: ubuntu-latest
    # Schutz gegen Hänger, kein Qualitäts-Gate: doppelter längster Job (2,6 Min.), aufgerundet (Plan 0013, E5).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # wie im E2E-Job: 300 s je Versuch, bis zu drei, Schritt höchstens 15 min (Plan 0027)
      - name: Playwright-Browser
        timeout-minutes: 15
        run: |
          # Ein abgebrochener Versuch kann ein apt-get mit dpkg-Lock hinterlassen: Der nächste wartet darauf.
          echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          for i in 1 2 3; do
            timeout 300 pnpm exec playwright install --with-deps chromium && exit 0
            echo "::warning::Browser-Installation Versuch $i hing oder schlug fehl, neuer Versuch"
          done
          exit 1
      - name: Deploy-Build
        run: pnpm build
      - name: Smoke mit echten Daten
        run: pnpm exec playwright test
        env:
          CI: "true"
          PW_SUITE: smoke
      - name: Schrift-Swap je Fallback (Plan 0007, B6)
        if: always()
        run: cat test-results/font-swap-werte.txt || echo "keine Swap-Werte"
      - name: Bundle-Budgets
        run: pnpm size
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7
      - name: Pages-Artefakt
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Der eine Knoten für „alles grün“, auch auf Branches. Wird übersprungen, sobald ein Prüf-Job rot ist.
  gates:
    name: Alle Gates grün
    needs: [check, e2e, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "alle Gates grün"

  deploy:
    name: Deploy (GitHub Pages)
    needs: gates
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
