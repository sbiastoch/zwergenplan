# Nachtlauf (Plan 0032, E6). Drei Modi, Schalter für den Zeitplan ist die Repo-Variable NACHTLAUF_MODUS (leer = messen):
#
#   messen   Stufe 1 / S1.2: NUR Messung – Abruf aller Eingaben nach Katalog, normalisiert und gehasht
#            (`pnpm pipeline fetch`), Vergleich mit der Vornacht. Kein Modell, kein Schreiben nach data/, kein Push.
#   trocken  S3.2: voller Lauf mit Modell (`pnpm pipeline nightly`, schreibt data/ nur im Runner), Gates, Bericht,
#            Artefakte (runs/<datum>/ und data/ des Laufs). Kein Push.
#   live     S3.4: wie trocken, danach `pipeline publish` (Commit nach main, `pull --rebase`, Konflikt → rot ohne
#            Push) und CI per workflow_dispatch (ein Push mit GITHUB_TOKEN startet sonst keine CI). Nur auf main.
#            Erst einschalten, wenn ADR 0026 (Abweichung von ADR 0002: Push aus Actions) mindestens vorgeschlagen ist.
#
# Der Job mit dem Modell hat nur `contents: read`; Schreibrecht und Token hat allein der Job `veroeffentlichen`, und
# dort nur der Schritt, der pusht (persist-credentials: false). Rot nach E6: Gates rot, Push gescheitert, Ampel rot
# (mehr als 20 % fehler, Abbruch, Bremse, Zeitbudget, Live-Stand mehr als einen Tag hinter main), siehe
# `pnpm pipeline status`. Ab `live` committet der Lauf jede Nacht (data/kosten.csv), sonst schaltet GitHub den
# Zeitplan nach 60 Tagen ohne Commit ab.
name: Nachtlauf

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC
  workflow_dispatch:
    inputs:
      modus:
        description: "messen | trocken | live"
        type: choice
        options: [trocken, messen, live]
        default: trocken
      max_calls:
        description: "Bremse MAX_CALLS (E8)"
        default: "150"
      max_tokens:
        description: "Bremse MAX_TOKENS (E8)"
        default: "3000000"
      budget_min:
        description: "Zeitbudget RUN_BUDGET_MIN in Minuten"
        default: "50"
      only:
        description: "nur diese Anbieter (Komma-Liste, leer = alle)"
        default: ""
      timeout:
        description: "timeout-minutes des Nachtlaufs (Plan 0048, E7; mindestens budget_min + 40)"
        default: "90"
      umstellen:
        description: "Umstellung auf V2 erzwingen, nach Prüfung (Plan 0048, E7; Komma-Liste)"
        default: ""

permissions:
  contents: read

concurrency:
  # gemeinsam mit discover.yml (Stufe 4); ein verworfener wartender Lauf ist hinnehmbar (E6)
  group: daten
  cancel-in-progress: false

env:
  # gepinnt wie spike-cli.yml (S1.1); Update nur mit Eval-Lauf und llm.test.ts (R7)
  CLI_VERSION: "2.1.296"
  # Modell der Extraktion (Plan 0048, Nachtrag 2): Opus mit Effort xhigh, auch der zweite Versuch nach einem
  # Einbruch. Teil des Cache-Schlüssels: Ein Wechsel extrahiert einmal alles neu (Skill, Abschnitt 5).
  LLM_MODEL_EXTRACT: opus
  LLM_MODEL_FALLBACK: opus
  LLM_EFFORT_EXTRACT: xhigh

jobs:
  modus:
    name: Modus
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      modus: ${{ steps.m.outputs.modus }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          VAR_MODUS: ${{ vars.NACHTLAUF_MODUS }}
          INPUT_MODUS: ${{ inputs.modus }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT" == schedule ]]; then modus="${VAR_MODUS:-messen}"; else modus="${INPUT_MODUS:-trocken}"; fi
          case "$modus" in messen|trocken|live) ;; *) echo "::error::unbekannter Modus: $modus"; exit 1 ;; esac
          if [[ "$modus" == live && "$REF" != refs/heads/main ]]; then
            echo "::error::Modus live nur auf main ($REF)"; exit 1
          fi
          echo "modus=$modus" >> "$GITHUB_OUTPUT"
          echo "Modus: **$modus** ($EVENT)" >> "$GITHUB_STEP_SUMMARY"

  # ── messen (S1.2, unverändert) ─────────────────────────────────────────────────────────────────────────────────
  fetch:
    name: Abruf und Hashes (S1.2)
    needs: modus
    if: needs.modus.outputs.modus == 'messen'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Zeitlimits und Wiederholung gegen hängendes apt (2026-10-08), siehe Skript; danach ist der apt-Index frisch.
      - name: Playwright-Chromium (render browser)
        timeout-minutes: 9
        run: .github/install-browsers.sh chromium
      - name: pdftotext (poppler-utils)
        timeout-minutes: 3
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Datum (Berlin)
        id: datum
        run: echo "datum=$(TZ=Europe/Berlin date +%F)" >> "$GITHUB_OUTPUT"
      # hashes.json der Vornacht: neuester Cache-Eintrag mit dem Präfix (Schlüssel je Lauf eindeutig)
      - name: Vornacht laden
        uses: actions/cache/restore@v4
        with:
          path: .cache/nightly-prev
          key: nightly-hashes-${{ github.run_id }}
          restore-keys: nightly-hashes-
      - name: Abruf
        env:
          OUT: runs/${{ steps.datum.outputs.datum }}/fetch
        run: pnpm pipeline fetch --out "$OUT" --compare .cache/nightly-prev/hashes.json
      - name: Bericht
        if: always()
        env:
          OUT: runs/${{ steps.datum.outputs.datum }}/fetch
        run: cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY" || echo "kein Bericht" >> "$GITHUB_STEP_SUMMARY"
      - name: Hashes für die nächste Nacht
        env:
          OUT: runs/${{ steps.datum.outputs.datum }}/fetch
        run: |
          mkdir -p .cache/nightly-prev
          cp "$OUT/hashes.json" .cache/nightly-prev/hashes.json
      - uses: actions/cache/save@v4
        with:
          path: .cache/nightly-prev
          key: nightly-hashes-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nachtlauf-${{ steps.datum.outputs.datum }}-${{ github.run_id }}
          path: runs/${{ steps.datum.outputs.datum }}/fetch/
          retention-days: 14

  # ── trocken und live: Lauf mit Modell, nur Leserecht ───────────────────────────────────────────────────────────
  nachtlauf:
    name: Nachtlauf (${{ needs.modus.outputs.modus }})
    needs: modus
    if: needs.modus.outputs.modus == 'trocken' || needs.modus.outputs.modus == 'live'
    runs-on: ubuntu-latest
    # beim Zeitplan sind die Eingaben leer, dann gilt 90 (Plan 0048, E7)
    timeout-minutes: ${{ fromJSON(inputs.timeout || '90') }}
    outputs:
      ampel: ${{ steps.status.outputs.ampel }}
      run_dir: ${{ steps.nightly.outputs.run_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # ganze Historie: Live-Stand gegen origin/main (Commits seit dem ausgelieferten, E6)
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright-Chromium (render browser)
        timeout-minutes: 9
        run: .github/install-browsers.sh chromium
      - name: pdftotext (poppler-utils)
        timeout-minutes: 3
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: claude-code CLI (gepinnt)
        run: |
          npm i -g "@anthropic-ai/claude-code@${CLI_VERSION}"
          echo "CLI: $(claude --version)" >> "$GITHUB_STEP_SUMMARY"
      # `pipeline oepnv` entfällt: data/oepnv/fahrplan.json liegt im Repo, Gates und Build brauchen keinen neuen
      # Auszug (veraltet → nur Warnung in data:validate); der Fahrplan bleibt Handarbeit über den Skill.
      - name: Nachtlauf
        id: nightly
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAX_CALLS: ${{ inputs.max_calls }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          RUN_BUDGET_MIN: ${{ inputs.budget_min }}
          ONLY: ${{ inputs.only }}
          UMSTELLEN: ${{ inputs.umstellen }}
          TIMEOUT: ${{ inputs.timeout || '90' }}
        run: |
          [[ "$ONLY" =~ ^[a-z0-9,-]*$ ]] || { echo "::error::only enthält unerlaubte Zeichen"; exit 1; }
          [[ "$UMSTELLEN" =~ ^[a-z0-9,-]*$ ]] || { echo "::error::umstellen enthält unerlaubte Zeichen"; exit 1; }
          [[ "${RUN_BUDGET_MIN:-50}" =~ ^[0-9]+$ && "$TIMEOUT" =~ ^[0-9]+$ ]] || { echo "::error::budget_min und timeout müssen Zahlen sein"; exit 1; }
          # Zeitbudget mindestens 40 Minuten unter dem Job-Limit: laufende Einheiten (bis zu zwei Aufrufe à 15 Min.),
          # Build, Gates, Bericht und Upload brauchen ihre Zeit; ein Timeout verwirft den ganzen Lauf (E7, Review 4 M1)
          if (( ${RUN_BUDGET_MIN:-50} + 40 > TIMEOUT )); then
            echo "::error::budget_min (${RUN_BUDGET_MIN:-50}) + 40 > timeout ($TIMEOUT)"; exit 1
          fi
          args=()
          [[ -n "$ONLY" ]] && args+=(--only "$ONLY")
          [[ -n "$UMSTELLEN" ]] && args+=(--umstellen "$UMSTELLEN")
          pnpm pipeline nightly "${args[@]}"
      - name: Gates (data:validate, check:fast)
        id: gates
        run: pnpm data:validate && pnpm check:fast
      - name: Bericht
        id: status
        if: ${{ !cancelled() }}
        env:
          RUN_DIR: ${{ steps.nightly.outputs.run_dir }}
          GATES: ${{ steps.gates.outcome }}
        run: pnpm pipeline status "$RUN_DIR" --gates "$GATES" --report-only --waechter
      # Text des Wächter-Issues (Plan 0048, E10); leer heißt nichts offen. Der Job `waechter` hat keinen Checkout.
      - name: Wächter sichern
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: waechter
          path: ${{ steps.nightly.outputs.run_dir }}/waechter.md
          retention-days: 14
          if-no-files-found: error
      - name: Laufverzeichnis sichern
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nachtlauf-${{ github.run_id }}
          # Eingaben, Bericht, nightly.json (Antworten und Aufrufe), kosten.jsonl
          path: runs/
          retention-days: 14
      - name: Daten des Laufs sichern
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          # data/raw, offers.json, kosten.csv: Diff ansehen (trocken), Eingabe für `veroeffentlichen` (live)
          name: daten-${{ github.run_id }}
          path: |
            data/raw/
            data/offers.json
            data/kosten.csv
          retention-days: 14
          if-no-files-found: error

  # ── live: veröffentlichen, nur hier Schreibrecht ───────────────────────────────────────────────────────────────
  veroeffentlichen:
    name: Veröffentlichen
    needs: [modus, nachtlauf]
    if: needs.modus.outputs.modus == 'live' && needs.nachtlauf.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Stand des Laufs auf main legen; `publish` holt fremde Commits per `pull --rebase` nach (Konflikt → rot)
      - name: Daten des Laufs übernehmen
        run: |
          git checkout -q -B main "$GITHUB_SHA"
          rm -rf data/raw
      - uses: actions/download-artifact@v4
        with:
          name: daten-${{ github.run_id }}
          path: data/
      - uses: actions/download-artifact@v4
        with:
          name: nachtlauf-${{ github.run_id }}
          path: runs/
      - name: publish (Commit und Push nach main)
        id: publish
        env:
          RUN_DIR: ${{ needs.nachtlauf.outputs.run_dir }}
          TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # kein pre-commit-Hook (check:fast samt Tests) mit Token in der Umgebung; die Gates liefen im Job nachtlauf
          # auf genau diesen Daten, publish prüft vor dem Commit und nach dem Rebase mit validate-data
          LEFTHOOK: "0"
        run: |
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          unset TOKEN
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          pnpm pipeline publish "$RUN_DIR"
      - name: CI auf main starten
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"

  # ── Wächter (Plan 0048, E10): ein Issue mit allen offenen Befunden, geschlossen, wenn nichts offen ist ──────────
  # Nach `veroeffentlichen`, kann den Push also nicht verhindern; ohne continue-on-error: Scheitert er, wird der Lauf
  # rot. Nur `issues: write`, kein Checkout, kein Code aus dem Repo: gh und jq, Text nur per --body-file.
  waechter:
    name: Wächter
    needs: [modus, nachtlauf, veroeffentlichen]
    if: always() && needs.modus.outputs.modus == 'live' && needs.nachtlauf.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: waechter
          path: waechter/
      - name: Issue pflegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=(--repo "$GITHUB_REPOSITORY")
          body=waechter/waechter.md
          # Paare schluessel:art aus dem Marker, je Zeile eins (Zeichensatz wie WATCH_MARKER in lib/watch.ts)
          pairs() { grep -oxE '<!-- waechter: [a-z0-9:,#-]* -->' | sed -e 's/^<!-- waechter: //' -e 's/ -->$//' | tr ',' '\n' | sed '/^$/d' | sort -u; }
          gh label create waechter "${repo[@]}" --color B60205 --description "Wächter des Nachtlaufs (Plan 0048, E10)" --force
          issue="$(gh issue list "${repo[@]}" --app github-actions --label waechter --state all --limit 1 --json number,state,body)"
          num="$(jq -r '.[0].number // empty' <<<"$issue")"
          state="$(jq -r '.[0].state // empty' <<<"$issue")"
          if [[ ! -s "$body" ]]; then
            if [[ "$state" == OPEN ]]; then
              printf 'Nichts offen (%s)\n' "$(TZ=Europe/Berlin date +%d.%m.%Y)" > closing.md
              gh issue comment "$num" "${repo[@]}" --body-file closing.md
              gh issue close "$num" "${repo[@]}"
            fi
            echo "Wächter: nichts offen" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$num" ]]; then
            gh issue create "${repo[@]}" --title "Wächter: Befunde des Nachtlaufs" --label waechter --body-file "$body"
            echo "Wächter: Issue angelegt" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '.[0].body // ""' <<<"$issue" | pairs > alt.txt || true
          pairs < "$body" > neu.txt || true
          [[ "$state" == CLOSED ]] && gh issue reopen "$num" "${repo[@]}"
          gh issue edit "$num" "${repo[@]}" --body-file "$body"
          comm -13 alt.txt neu.txt > hinzu.txt
          if [[ -s hinzu.txt ]]; then
            # Schlüssel ohne Hash der Seite: Anbieter und Art, die Zeile mit Seite steht im Issue-Text
            { echo "Neue Befunde ($(TZ=Europe/Berlin date +%d.%m.%Y)), Einzelheiten im Text oben:"; echo
              sed -E 's/^([a-z0-9-]+)(#[0-9a-f]+)?:([a-z]+)$/- `\1` · \3/' hinzu.txt; } > kommentar.md
            gh issue comment "$num" "${repo[@]}" --body-file kommentar.md
          fi
          echo "Wächter: Issue #$num, $(wc -l < neu.txt) Befunde, $(wc -l < hinzu.txt) neu" >> "$GITHUB_STEP_SUMMARY"

  # ── Ampel: rot nach E6 ─────────────────────────────────────────────────────────────────────────────────────────
  ampel:
    name: Ampel
    needs: [modus, nachtlauf, veroeffentlichen]
    if: always() && (needs.modus.outputs.modus == 'trocken' || needs.modus.outputs.modus == 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          MODUS: ${{ needs.modus.outputs.modus }}
          AMPEL: ${{ needs.nachtlauf.outputs.ampel }}
          LAUF: ${{ needs.nachtlauf.result }}
          PUSH: ${{ needs.veroeffentlichen.result }}
        run: |
          echo "Ampel ${AMPEL:-unbekannt}, Nachtlauf ${LAUF}, Veröffentlichen ${PUSH} (Modus ${MODUS})" | tee -a "$GITHUB_STEP_SUMMARY"
          rot=0
          [[ "$AMPEL" == rot || -z "$AMPEL" ]] && rot=1
          [[ "$LAUF" != success ]] && rot=1
          [[ "$MODUS" == live && "$PUSH" != success ]] && rot=1
          exit "$rot"
