# zentrale Termin-DB der ELKB mit offener JSON/XML/iCal-API (siehe Eintrag et-dekanat-nuernberg).
# Pro Gemeinde: vid = Veranstalter-ID in ET. Feeds: https://www.evangelische-termine.de/ical?vid=<vid>
# bzw. .../json?vid=<vid>&itemsPerPage=500 (optional &q=<Suchwort>, durchsucht auch Beschreibungen).

- id: et-dekanat-nuernberg
  name: "Evangelische Termine – Dekanat Nürnberg (alle ev. Gemeinden, Aggregator)"
  address: "eckstein, Burgstraße 1-3, 90403 Nürnberg"
  district: Altstadt
  ring: innen
  age: "0-6"
  topics: [krabbelgruppe, eltern-kind-gruppe, musik, singen, elterncafe, krabbelgottesdienst]
  format: [regelmaessig, offener-treff, einzeltermin]
  cost: [teils-kostenlos]
  registration: [ohne-anmeldung, mit-anmeldung]
  programme:
    - url: "https://www.evangelische-termine.de/json?region=507&highlight=all&itemsPerPage=2500&q=krabbel"
      kind: json-api
      note: "region=507 = Dekanat Nürnberg (enthält auch Röthenbach/Schwaig/Heroldsberg – nach _place_CITY filtern). highlight=all ist Pflicht, sonst nur Highlights. Max. ~2500-3000 Einträge pro Seite, pageID=2.. für mehr. q= ist ODER-Suche über Wörter (mehrwortige Suchen liefern zu viel) und durchsucht Titel+Beschreibung. Sinnvolle Einzel-Suchwörter: krabbel, miniclub, mini-club, mutter-kind, eltern-kind, musikzwerge, minigottesdienst, minikirche, familiencafé. Felder: START, END, _event_TITLE, SUBTITLE, _event_LONG_DESCRIPTION, _place_NAME/_place_STREET_NR/_place_ZIP/_place_CITY, _user_ID (=vid), _user_REALNAME, _user_URL, _event_LINK"
    - url: "https://www.evangelische-termine.de/ical?region=507&highlight=all&q=krabbel"
      kind: ical
      note: "gleicher Filter als iCal; per vid: https://www.evangelische-termine.de/ical?vid=<vid>"
    - url: "https://www.feb-nuernberg.de/service/veranstaltungskalender/eltern-kind-gruppen"
      kind: html
      note: "Übersicht aller Eltern-Kind-Gruppen ev. Gemeinden (Forum Erwachsenenbildung, speist sich aus ET), 2 Seiten (Pagination-Link 'nächste'), Wochentag/Uhrzeit/Ort/Kontakt"
  availability:
    shown: teilweise
    how: "Kein Platz-Feld; Gemeinden schreiben gelegentlich '(Warteliste)' bzw. 'voll' in den Titel/Untertitel – Titel parsen"
    system: "evangelische-termine.de (ELKB)"
  verified: 2026-10-04
  notes: "Aggregator, kein Einzelanbieter. Für den Skill die effizienteste Quelle: ein JSON-Abruf deckt alle ev. Krabbel-/Miniclub-Gruppen der Stadt ab. Wöchentliche Gruppen sind als Einzeltermine je Woche eingetragen (inkl. Ferienpausen). Neues Tag 'krabbelgottesdienst' vorgeschlagen: Mini-/Krabbel-/Kleinkindergottesdienste (0-6 J. mit Eltern) sind ein typisches kirchliches Format, das in keine bestehende Kategorie passt."

